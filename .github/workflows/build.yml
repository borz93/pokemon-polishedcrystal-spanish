# Continuous Integration Workflow
name: "CI Build"

on:
  pull_request:
    branches:
      - spanish-translation
  workflow_call:

env:
  # PC_VERSION should match VERSION in Makefile
  PC_VERSION: "3.2.3"
  RGBDS_VERSION: "v1.0.3"

jobs:
  build-ubuntu:
    name: "Build"
    runs-on: ubuntu-latest
    steps:
      # INSTALL DEPENDENCIES
      - id: apt-get-depends
        name: "Install build dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install bison gcc git make libpng-dev -y;

      # CHECKOUT RGBDS
      - id: checkout-rgbds
        name: "Checkout gbdev/rgbds"
        uses: actions/checkout@v7
        with:
          path: rgbds
          ref: ${{ env.RGBDS_VERSION }}
          repository: gbdev/rgbds

      # INSTALL RGBDS
      - id: install-rgbds
        name: "Install gbdev/rgbds"
        working-directory: rgbds
        run: |
          sudo make install

      # CHECKOUT REPOSITORY
      - id: checkout-polishedcrystal
        name: "Checkout repository"
        uses: actions/checkout@v7

      # BUILD ROM
      - id: build-polishedcrystal
        name: "Build polishedcrystal"
        run: |
          make -j$(nproc)
          mkdir build
          mv polishedcrystal-${{ env.PC_VERSION }}.gbc build/polishedcrystal-dev-spanish-translation.gbc
          mv polishedcrystal-${{ env.PC_VERSION }}.sym build/polishedcrystal-dev-spanish-translation.sym
          make tidy

      # UPLOAD ARTIFACT
      - id: upload-polishedcrystal
        name: "Upload polishedcrystal artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: "polishedcrystal"
          retention-days: 1
          path: |
            build/polishedcrystal-dev-spanish-translation.*
