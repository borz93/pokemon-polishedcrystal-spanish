# Dev Rolling Build & Pre-release
name: "Dev Rolling Release"

on:
  push:
    branches:
      - spanish-translation
  workflow_dispatch:

permissions:
  contents: write

env:
  DEV_TAG: "do-not-checkout"
  DEV_NAME: "Development Rolling Release (traducción al español)"
  DEV_BODY: |
    Esta es la versión de desarrollo más reciente de la traducción al español de Polished Crystal, generada automáticamente en cada cambio subido a la rama `spanish-translation`. **Solo para pruebas** — puede contener textos sin traducir o fallos aún no corregidos.

    El nombre del archivo incluye el hash corto (8 caracteres) del commit exacto con el que se compiló.

    El **.gbc** es el ROM. Cárgalo en [mGBA](https://mgba.io/), [BGB](https://bgb.bircd.org/) u otro emulador de Game Boy Color preciso.

    El **.sym** es el archivo de símbolos, útil solo para depuración.

    Hack original: [Polished Crystal, de Rangi42](https://github.com/Rangi42/polishedcrystal).

jobs:
  build:
    name: "Dev Rolling Release Build"
    uses: ./.github/workflows/build.yml

  release:
    name: "Dev Rolling Release / Release"
    runs-on: ubuntu-latest
    needs: build
    steps:
      # SET ENVIRONMENT VARIABLES
      - id: set-env-var
        name: "Set environment variables"
        run: |
          echo "SHORT_SHA=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_ENV

      # CHECKOUT REPOSITORY
      - id: checkout-polishedcrystal
        name: "Checkout repository"
        uses: actions/checkout@v7

      # DOWNLOAD BUILD ARTIFACT
      - id: download-polishedcrystal
        name: "Download polishedcrystal"
        uses: actions/download-artifact@v8
        with:
          name: "polishedcrystal"
          path: "./build"

      # DELETE OLD RELEASE (if any)
      - name: Delete old release
        id: delete_release
        uses: cb80/delrel@v0.19.0
        with:
          tag: ${{ env.DEV_TAG }}

      # ADVANCE DEV TAG TO CURRENT COMMIT
      - name: Advance dev tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag ${{ env.DEV_TAG }} -f
          git push --tags -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

      # CREATE NEW RELEASE
      - name: Create new release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.DEV_TAG }}
          name: ${{ env.DEV_NAME }}
          body: ${{ env.DEV_BODY }}
          draft: false
          prerelease: true

      # UPLOAD ASSETS
      - name: Upload assets
        id: upload
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.DEV_TAG }}
          files: |
            ./build/polishedcrystal-dev-spanish-translation-${{ env.SHORT_SHA }}.gbc
            ./build/polishedcrystal-dev-spanish-translation-${{ env.SHORT_SHA }}.sym
